name: Website

# Publishes website/ (plus the app screenshots from docs/) to GitHub Pages.
# One-time setup: Settings > Pages > Build and deployment > Source: GitHub Actions.
# Until then the deploy step is skipped with a warning instead of failing.
on:
  push:
    paths:
      - "website/**"
      - "docs/screenshots/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r website/. _site/
          cp -r docs/screenshots _site/screenshots
          touch _site/.nojekyll
          test -f _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true
      - if: steps.pages.outcome != 'success'
        run: echo "::warning::GitHub Pages isn't enabled for this repository (Settings > Pages > Source - GitHub Actions). Skipped the deploy."
      - id: deployment
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@v4
      - name: Check the live site
        if: steps.deployment.outcome == 'success'
        env:
          URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for i in $(seq 1 30); do
            curl -fsS "$URL" | grep -q "<title>OffsecHub</title>" && break
            sleep 5
          done
          curl -fsS "$URL" | grep -q "<title>OffsecHub</title>"
          for path in fonts/MartianMono-var.woff2 screenshots/dashboard.png; do
            curl -fsS -o /dev/null -w "%{http_code} $URL$path\n" "$URL$path"
          done
          echo "Live at $URL"
