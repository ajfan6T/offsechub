name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -e "./backend[dev]"
      - name: Test (vault crypto, local API, domain, desktop shell, fuzzing)
        working-directory: backend
        run: pytest -q
      - name: Cross-check the Argon2id vector (docs/VAULT_FORMAT.md) with the reference CLI
        run: |
          sudo apt-get install -y --no-install-recommends argon2
          got=$(printf 'correct horse battery staple' | argon2 offsechub-salt16 -id -k 19456 -t 2 -p 1 -l 32 -r)
          test "$got" = 528bb0a98a6034439a6889c394d0678cdfd61171bdcdeff1d57a7ceac5b89659

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  desktop:
    needs: [backend, frontend]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Linux GUI libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgirepository-2.0-dev libcairo2-dev \
            gir1.2-girepository-3.0 gir1.2-webkit2-4.1 gir1.2-gtk-3.0 xvfb
          pip install -e "./backend[gtk]"
      - name: Build
        run: |
          pip install -e "./backend[build]"
          pyinstaller packaging/offsechub.spec --noconfirm --distpath dist --workpath build/pyinstaller
      - name: Smoke test the bundle
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then exe=dist/OffsecHub/offsechub.exe
          elif [ "$RUNNER_OS" = "macOS" ]; then exe=dist/OffsecHub.app/Contents/MacOS/offsechub
          else exe=dist/OffsecHub/offsechub; fi
          "$exe" version
      - uses: actions/upload-artifact@v4
        with:
          name: OffsecHub-${{ runner.os }}
          path: dist/OffsecHub*
