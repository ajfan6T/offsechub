name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: offsechub
          POSTGRES_PASSWORD: offsechub
          POSTGRES_DB: offsechub_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U offsechub" --health-interval 5s --health-retries 10
    strategy:
      matrix:
        database: [sqlite, postgres]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "./backend[dev,postgres]"
      - name: Test
        working-directory: backend
        env:
          OFFSECHUB_TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://offsechub:offsechub@localhost:5432/offsechub_test' || '' }}
        run: |
          if [ -z "$OFFSECHUB_TEST_DATABASE_URL" ]; then unset OFFSECHUB_TEST_DATABASE_URL; fi
          pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
