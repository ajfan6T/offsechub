name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -e "./backend[dev]"
      - name: Test (vault crypto, local API, domain, desktop shell, fuzzing)
        working-directory: backend
        run: pytest -q
      - name: Cross-check the Argon2id vector (docs/VAULT_FORMAT.md) with the reference CLI
        run: |
          sudo apt-get install -y --no-install-recommends argon2
          got=$(printf 'correct horse battery staple' | argon2 offsechub-salt16 -id -k 19456 -t 2 -p 1 -l 32 -r)
          test "$got" = 528bb0a98a6034439a6889c394d0678cdfd61171bdcdeff1d57a7ceac5b89659

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  # Every push: unsigned installers, built, installed and smoke-tested on each
  # OS, plus a rehearsal of the signing pipelines (see docs/CODE_SIGNING.md).
  installers:
    name: installer (${{ matrix.os }})
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    needs: [backend, frontend]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Linux .deb
        if: runner.os == 'Linux'
        run: packaging/ci/linux.sh
      - name: macOS .dmg (ad hoc, hardened runtime)
        if: runner.os == 'macOS'
        run: packaging/ci/macos.sh
      - name: Windows setup.exe
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          ./packaging/ci/windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ runner.os }}
          if-no-files-found: error
          path: |
            dist/offsechub_*_amd64.deb
            dist/OffsecHub-*.dmg
            dist/offsechub-setup-*.exe
      - name: Signing rehearsal (throwaway certificate)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/ci/windows.ps1 -SigningDryRun

  # A tag like v0.2.0: the same builds, signed and notarized with the credentials
  # held by the protected "release" environment, then published as a release.
  # Without credentials they are built unsigned, with a warning.
  release-installers:
    name: signed installer (${{ matrix.os }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [backend, frontend]
    environment: release
    permissions:
      contents: read
      id-token: write  # OpenID Connect to Azure, for Artifact Signing
    env:
      HAS_DEVELOPER_ID: ${{ secrets.MACOS_CERTIFICATE != '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Linux .deb
        if: runner.os == 'Linux'
        run: packaging/ci/linux.sh

      - name: Developer ID certificate and notarization key
        if: runner.os == 'macOS' && env.HAS_DEVELOPER_ID == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: packaging/macos/import_certificate.sh
      - name: macOS .dmg (signed, notarized)
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: packaging/ci/macos.sh

      - name: Sign in to Azure (OpenID Connect, no stored secret)
        if: runner.os == 'Windows' && vars.ARTIFACT_SIGNING_ACCOUNT != ''
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Windows setup.exe (signed)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          ARTIFACT_SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
        run: |
          choco install innosetup --no-progress -y
          ./packaging/ci/windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ runner.os }}
          if-no-files-found: error
          path: |
            dist/offsechub_*_amd64.deb
            dist/OffsecHub-*.dmg
            dist/offsechub-setup-*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release-installers
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: The tag matches the app version
        run: test "${GITHUB_REF_NAME#v}" = "$(python3 packaging/version.py)"
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
