name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -e "./backend[dev]"
      - name: Test (vault crypto, local API, domain, desktop shell, fuzzing)
        working-directory: backend
        run: pytest -q
      - name: Cross-check the Argon2id vector (docs/VAULT_FORMAT.md) with the reference CLI
        run: |
          sudo apt-get install -y --no-install-recommends argon2
          got=$(printf 'correct horse battery staple' | argon2 offsechub-salt16 -id -k 19456 -t 2 -p 1 -l 32 -r)
          test "$got" = 528bb0a98a6034439a6889c394d0678cdfd61171bdcdeff1d57a7ceac5b89659

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  installers:
    name: installer (${{ matrix.os }})
    needs: [backend, frontend]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      # Linux: a .deb on the system's WebKitGTK, installed with apt as a user would.
      - name: Build the .deb
        if: runner.os == 'Linux'
        run: packaging/linux/build_deb.sh
      - name: Install with apt, smoke test, uninstall
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ./dist/offsechub_*_amd64.deb
          xvfb-run -a python packaging/smoke_test.py --app /usr/bin/offsechub
          python packaging/smoke_test.py --app /usr/bin/offsechub --browser
          sudo apt-get remove -y offsechub
          test ! -e /opt/offsechub

      # macOS: an app bundle in a disk image.
      - name: Build the .dmg
        if: runner.os == 'macOS'
        run: |
          pip install -e "./backend[build]"
          packaging/macos/build_dmg.sh
      - name: Install from the disk image, smoke test
        if: runner.os == 'macOS'
        run: |
          hdiutil attach dist/OffsecHub-*.dmg -nobrowse -mountpoint "$RUNNER_TEMP/dmg"
          ditto "$RUNNER_TEMP/dmg/OffsecHub.app" "$RUNNER_TEMP/Applications/OffsecHub.app"
          hdiutil detach "$RUNNER_TEMP/dmg"
          python packaging/smoke_test.py --app "$RUNNER_TEMP/Applications/OffsecHub.app/Contents/MacOS/offsechub"

      # Windows: offsechub-setup-<version>.exe (Inno Setup).
      - name: Build the setup.exe
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          ./packaging/build.ps1 -SkipFrontend
      - name: Install silently, smoke test, uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist\offsechub-setup-*.exe | Select-Object -First 1).FullName
          $dir = Join-Path $env:RUNNER_TEMP "OffsecHub"
          $log = Join-Path $env:RUNNER_TEMP "setup.log"
          $p = Start-Process $setup -Wait -PassThru -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/DIR=`"$dir`"", "/LOG=`"$log`""
          if ($p.ExitCode -ne 0) { Get-Content $log; throw "setup exited with $($p.ExitCode)" }
          python packaging/smoke_test.py --app "$dir\offsechub.exe" --cli "$dir\offsechub-cli.exe"
          if ($LASTEXITCODE -ne 0) { throw "smoke test failed" }
          # The uninstaller relaunches itself from %TEMP%, so wait for the files to go.
          Start-Process "$dir\unins000.exe" -Wait -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
          for ($i = 0; ($i -lt 60) -and (Test-Path "$dir\offsechub.exe"); $i++) { Start-Sleep 1 }
          if (Test-Path "$dir\offsechub.exe") { throw "uninstall left the app behind" }

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ runner.os }}
          if-no-files-found: error
          path: |
            dist/offsechub_*_amd64.deb
            dist/OffsecHub-*.dmg
            dist/offsechub-setup-*.exe

  # Push a tag like v0.2.0 to publish the three installers as a GitHub release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: installers
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: The tag matches the app version
        run: test "${GITHUB_REF_NAME#v}" = "$(python3 packaging/version.py)"
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
