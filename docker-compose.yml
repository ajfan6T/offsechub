# Production-like stack: PostgreSQL + OffsecHub.
# Put a TLS-terminating reverse proxy in front and set OFFSECHUB_COOKIE_SECURE=true.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: offsechub
      POSTGRES_USER: offsechub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U offsechub"]
      interval: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      OFFSECHUB_DATABASE_URL: postgresql+psycopg://offsechub:${POSTGRES_PASSWORD}@db:5432/offsechub
      OFFSECHUB_ADMIN_EMAIL: ${OFFSECHUB_ADMIN_EMAIL:-admin@offsechub.local}
      OFFSECHUB_ADMIN_PASSWORD: ${OFFSECHUB_ADMIN_PASSWORD:-}
      OFFSECHUB_COOKIE_SECURE: ${OFFSECHUB_COOKIE_SECURE:-false}
    volumes:
      - evidence:/data
    # Bound to localhost by default: this app holds client vulnerability data.
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  pgdata:
  evidence:
