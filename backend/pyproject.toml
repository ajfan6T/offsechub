[project]
name = "offsechub"
version = "0.2.0"
description = "Local-first, encrypted desktop workspace for penetration testing engagements: scope, targets, recon, testing, evidence, findings and reports."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "jinja2>=3.1",
    "defusedxml>=0.7",
    "cryptography>=42",
    "argon2-cffi>=23.1",
    "pywebview>=5.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "hypothesis>=6.100"]
# Linux desktop window: WebKitGTK via PyGObject (needs the system's gir1.2-webkit2-4.1).
gtk = ["PyGObject>=3.42"]
build = ["pyinstaller>=6.6"]

[project.scripts]
offsechub = "app.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["data/methodologies/*.json", "data/*.json", "templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
